[project]
name = "ai-institutions"
version = "0.1.0.dev0"
description = "Models of how openness, ownership and financing of AI R&D shape innovation, distribution and risk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-docs.md"]
authors = [{ name = "Shaoxiong Yao" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_institutions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
